# Run from the C++ project directory with ./build/Release/app config/rtp.yaml
# Paths may be relative to this YAML file, absolute, or start with ~/.
# Use camera calibration measured at the video's resolution.
dataset:
  type: FFMPEGDataset
  calibrationFile: ~/dev/network/calibration.yaml
  source: ~/dev/network/camera.sdp
  # You can also use a local video path or a URL such as "rtsp://camera.local/live".

# Use DummyPlotter for headless operation.
# Processing ends after five seconds without a decoded frame.
plotter:
  type: PangolinPlotter
  zUp: false

