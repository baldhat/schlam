name: C++

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    defaults:
      run:
        working-directory: schlam/cpp
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          xargs -r -a recipes/system-packages-ubuntu.txt sudo apt-get install -y

      - name: Install Conan
        run: python -m pip install conan==2.24.0

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Build pinned g2o package
        run: conan create recipes/g2o -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=2 -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Build pinned Pangolin package
        run: conan create recipes/pangolin -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=2 -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Install application dependencies
        run: conan install . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=2 -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Configure
        run: |
          cmake -S . -B build/${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/schlam/cpp/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          source build/${{ matrix.build_type }}/generators/conanrun.sh
          cmake --build build/${{ matrix.build_type }} --parallel 2

      - name: Run tests
        run: |
          source build/${{ matrix.build_type }}/generators/conanrun.sh
          ctest --test-dir build/${{ matrix.build_type }} --output-on-failure
  dataset:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    env:
      CC: gcc-14
      CXX: g++-14
      MAV_PATH: /home/baldhat/data/mav/vicon_room1
    defaults:
      run:
        working-directory: schlam/cpp
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install conan==2.24.0

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Build pinned g2o package
        run: conan create recipes/g2o -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Build pinned Pangolin package
        run: conan create recipes/pangolin -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Install application dependencies
        run: conan install . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Configure
        run: |
          cmake -S . -B build/${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/schlam/cpp/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          source build/${{ matrix.build_type }}/generators/conanrun.sh
          cmake --build build/${{ matrix.build_type }} --parallel "$(nproc)"

      - name: Run tests
        run: |
          source build/${{ matrix.build_type }}/generators/conanrun.sh
          ctest --test-dir build/${{ matrix.build_type }} --output-on-failure

      - name: Run headless config
        if: matrix.build_type == 'Release'
        run: |
          source build/${{ matrix.build_type }}/generators/conanrun.sh
          timeout 30m build/${{ matrix.build_type }}/app config/mav_headless.yaml

  memory_profile:
    name: Release memory profile (Heaptrack)
    if: github.event_name == 'push'
    needs: dataset
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
      MAV_PATH: /home/baldhat/data/mav/vicon_room1
      HEAPTRACK_OUTPUT_DIR: ${{ github.workspace }}/schlam/cpp/build/heaptrack
    defaults:
      run:
        working-directory: schlam/cpp
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install conan==2.24.0

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Build pinned g2o package
        run: conan create recipes/g2o -s build_type=Release -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Build pinned Pangolin package
        run: conan create recipes/pangolin -s build_type=Release -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Install application dependencies
        run: conan install . -s build_type=Release -s compiler.cppstd=23 --lockfile=conan.lock --build=missing -c tools.build:jobs=$(nproc) -c tools.files.download:retry=5 -c tools.files.download:retry_wait=10

      - name: Configure Release with debug symbols
        run: |
          cmake -S . -B build/Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/schlam/cpp/build/Release/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g"

      - name: Build Release app
        run: |
          source build/Release/generators/conanrun.sh
          cmake --build build/Release --target app --parallel "$(nproc)"

      - name: Profile Release heap memory
        id: profile
        run: |
          source build/Release/generators/conanrun.sh
          mkdir -p "$HEAPTRACK_OUTPUT_DIR"
          heaptrack --version > "$HEAPTRACK_OUTPUT_DIR/heaptrack-version.txt"
          cp config/mav_headless.yaml "$HEAPTRACK_OUTPUT_DIR/mav_headless.yaml"
          timeout --signal=INT --kill-after=30s 60m \
            heaptrack --record-only -o "$HEAPTRACK_OUTPUT_DIR/heaptrack.app" \
            build/Release/app config/mav_headless.yaml \
            2>&1 | tee "$HEAPTRACK_OUTPUT_DIR/run.log"

      - name: Summarize heap memory
        run: |
          shopt -s nullglob
          captures=("$HEAPTRACK_OUTPUT_DIR"/heaptrack.app.*)
          if (( ${#captures[@]} != 1 )); then
            echo "::error::Expected one Heaptrack capture, found ${#captures[@]}"
            exit 1
          fi
          heaptrack_print "${captures[0]}" > "$HEAPTRACK_OUTPUT_DIR/heaptrack-report.txt"
          {
            echo '### Release heap memory'
            echo
            echo 'Dataset: V1_02_medium; configuration: mav_headless.yaml.'
            echo
            echo '```text'
            tail -n 20 "$HEAPTRACK_OUTPUT_DIR/heaptrack-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload heap memory profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heaptrack-release-${{ github.sha }}-${{ github.run_attempt }}
          path: schlam/cpp/build/heaptrack/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
